<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPDUNBOXED Companion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a0a2e; color: #f0e6ff; font-family: Georgia, serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .container { width: 100%; max-width: 680px; height: 100vh; display: flex; flex-direction: column; padding: 20px; }
  h1 { text-align: center; color: #c084fc; font-size: 1.4rem; margin-bottom: 6px; }
  .subtitle { text-align: center; color: #a78bca; font-size: 0.85rem; margin-bottom: 16px; }
  .chat-box { flex: 1; overflow-y: auto; background: #120820; border-radius: 12px; padding: 20px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 14px; }
  .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; line-height: 1.6; font-size: 0.95rem; }
  .user { background: #6d28d9; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot { background: #2d1b4e; align-self: flex-start; border-bottom-left-radius: 4px; color: #e9d5ff; }
  .input-row { display: flex; gap: 10px; }
  textarea { flex: 1; background: #2d1b4e; border: 1px solid #6d28d9; color: #f0e6ff; border-radius: 10px; padding: 12px; font-size: 0.95rem; font-family: Georgia, serif; resize: none; height: 52px; }
  textarea:focus { outline: none; border-color: #c084fc; }
  button { background: #7c3aed; color: white; border: none; border-radius: 10px; padding: 0 20px; font-size: 1.1rem; cursor: pointer; }
  button:hover { background: #6d28d9; }
  .typing { color: #a78bca; font-style: italic; font-size: 0.85rem; align-self: flex-start; }
</style>
</head>
<body>
<div class="container">
  <h1>💜 BPDUNBOXED Companion</h1>
  <p class="subtitle">Peer support, not therapy. You're not alone.</p>
  <div class="chat-box" id="chatBox"></div>
  <div class="input-row">
    <textarea id="userInput" placeholder="What's going on?" onkeydown="handleKey(event)"></textarea>
    <button onclick="sendMessage()">➤</button>
  </div>
</div>
<script>
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  let messages = [];
  let greeted = false;

  window.onload = async () => {
    await getBotGreeting();
  };

  async function getBotGreeting() {
    const typing = addTyping();
    try {
      messages.push({ role: "user", content: "Hello" });
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });
      const data = await res.json();
      typing.remove();
      const reply = data.response;
      messages.push({ role: "assistant", content: reply });
      addMessage(reply, 'bot');
      greeted = true;
    } catch(e) {
      typing.remove();
      addMessage("Hey 💜 I'm here. What's going on?", 'bot');
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    messages.push({ role: "user", content: text });
    userInput.value = '';
    const typing = addTyping();
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });
      const data = await res.json();
      typing.remove();
      messages.push({ role: "assistant", content: data.response });
      addMessage(data.response, 'bot');
    } catch(e) {
      typing.remove();
      addMessage("Something went wrong. Please try again.", 'bot');
    }
  }

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.textContent = 'typing...';
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }
</script>
